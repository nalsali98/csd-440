<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Noor Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .form-container {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px #cccccc;
        }

        h1 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .radio-group input {
            width: auto;
        }

        .submit-button {
            background-color: #333333;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        .submit-button:hover {
            background-color: #555555;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h1>Customer Information Form</h1>

    <!--
        Name: Noor Al Salihi
        Assignment: Module 7.2 Programming Assignment
        Purpose: Collect seven different fields of information
        and send the information to NoorResponse.php.
    -->

    <form action="NoorResponse.php" method="post">

        <!-- Field 1: Text -->
        <label for="firstName">First Name:</label>
        <input type="text"
               id="firstName"
               name="firstName">

        <!-- Field 2: Text -->
        <label for="lastName">Last Name:</label>
        <input type="text"
               id="lastName"
               name="lastName">

        <!-- Field 3: Email -->
        <label for="email">Email Address:</label>
        <input type="email"
               id="email"
               name="email">

        <!-- Field 4: Number -->
        <label for="age">Age:</label>
        <input type="number"
               id="age"
               name="age"
               min="1"
               max="120">

        <!-- Field 5: Date -->
        <label for="birthDate">Birth Date:</label>
        <input type="date"
               id="birthDate"
               name="birthDate">

        <!-- Field 6: Select -->
        <label for="favoriteColor">Favorite Color:</label>
        <select id="favoriteColor" name="favoriteColor">
            <option value="">Select a color</option>
            <option value="Blue">Blue</option>
            <option value="Red">Red</option>
            <option value="Green">Green</option>
            <option value="Black">Black</option>
            <option value="White">White</option>
        </select>

        <!-- Field 7: Radio -->
        <label>Preferred Contact Method:</label>

        <div class="radio-group">
            <input type="radio"
                   id="contactEmail"
                   name="contactMethod"
                   value="Email">

            <label for="contactEmail">Email</label>

            <input type="radio"
                   id="contactPhone"
                   name="contactMethod"
                   value="Phone">

            <label for="contactPhone">Phone</label>
        </div>

        <br><br>

        <input class="submit-button"
               type="submit"
               value="Submit Form">

    </form>

</div>

</body>
</html>
